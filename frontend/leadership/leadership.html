<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leadership & Readiness — Learn2Lead</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <nav class="sticky top-0 z-40 flex items-center justify-between gap-4 border-b border-white/10 bg-slate-900 px-4 py-3 text-white md:px-6">
    <a href="/dashboard" class="flex items-center gap-3 font-extrabold">Learn<span class="text-sky-400">2</span>Lead</a>
    <div class="flex items-center gap-2 text-sm font-semibold">
      <a href="/dashboard" class="rounded-xl px-3 py-2 text-slate-300 hover:bg-white/10">Home</a>
      <a href="/static/employability/career.html" class="rounded-xl px-3 py-2 text-slate-300 hover:bg-white/10">Career Prep</a>
      <button onclick="logout()" class="rounded-xl bg-rose-600 px-3 py-2 text-xs font-bold">Logout</button>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl space-y-6 px-4 py-8">
    <section class="rounded-3xl bg-gradient-to-r from-emerald-950 via-slate-900 to-teal-950 p-7 text-white shadow-xl">
      <p class="text-xs font-bold uppercase tracking-widest text-emerald-300">Module 3</p>
      <h1 class="mt-2 text-3xl font-black">Leadership &amp; Readiness</h1>
      <p class="mt-2 max-w-2xl text-sm text-slate-300">Track growth, respond to leadership scenarios, and use personalized recommendations.</p>
    </section>

    <section class="grid gap-5 lg:grid-cols-3">
      <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
        <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Latest Readiness</p>
        <p id="latest-score" class="mt-2 text-4xl font-black">--</p>
      </div>
      <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
        <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Snapshots Recorded</p>
        <p id="snapshot-count" class="mt-2 text-4xl font-black">0</p>
      </div>
      <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
        <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Growth</p>
        <p id="score-growth" class="mt-2 text-4xl font-black">--</p>
      </div>
    </section>

    <section class="grid gap-6 lg:grid-cols-2">
      <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-black">AI Study Recommendations</h2>
          <button id="generate-recommendation" class="rounded-xl bg-emerald-600 px-3 py-2 text-xs font-bold text-white">Generate</button>
        </div>
        <div id="recommendation-list" class="mt-4 space-y-3"></div>
      </div>

      <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="text-lg font-black">Leadership Scenario</h2>
        <p id="scenario-text" class="mt-3 rounded-2xl bg-slate-50 p-4 text-sm leading-relaxed text-slate-700"></p>
        <div id="scenario-options" class="mt-3 grid gap-2"></div>
        <p id="scenario-feedback" class="mt-3 hidden rounded-xl border p-3 text-sm"></p>
      </div>
    </section>

    <section class="grid gap-6 lg:grid-cols-[1.4fr_.6fr]">
      <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="text-lg font-black">Readiness Growth</h2>
        <div id="history-list" class="mt-4 space-y-2"></div>
      </div>
      <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="text-lg font-black">Market Trend</h2>
        <div id="market-trends" class="mt-4 space-y-3"></div>
      </div>
    </section>
  </main>

  <script src="/static/leadership/leadership.js"></script>
</body>
</html>
