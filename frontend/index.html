<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Learn2Lead</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes floatSlow {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-16px) scale(1.05);
      }
    }

    @keyframes shimmerSweep {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    .animate-fade-up {
      animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-float-slow {
      animation: floatSlow 9s ease-in-out infinite;
    }

    .animate-float-delayed {
      animation: floatSlow 11s ease-in-out 2.5s infinite;
    }

    .delay-100 { animation-delay: 90ms; }
    .delay-200 { animation-delay: 180ms; }
    .delay-300 { animation-delay: 270ms; }

    .btn-shimmer {
      position: relative;
      overflow: hidden;
    }
    .btn-shimmer::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.28) 50%, transparent 70%);
      transform: translateX(-100%);
    }
    .btn-shimmer:hover::after {
      animation: shimmerSweep 0.75s ease-out;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">
  <!-- Ambient Floating Gradient Orbs -->
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="animate-float-slow absolute -top-28 -left-24 h-96 w-96 rounded-full bg-sky-500/20 blur-3xl"></div>
    <div class="animate-float-delayed absolute top-1/3 -right-28 h-[28rem] w-[28rem] rounded-full bg-indigo-500/20 blur-3xl"></div>
    <div class="animate-float-slow absolute -bottom-24 left-1/3 h-80 w-80 rounded-full bg-emerald-500/15 blur-3xl"></div>
  </div>

  <!-- Main Two-Column Auth Container -->
  <main class="w-full max-w-5xl grid lg:grid-cols-12 gap-8 items-center">
    <!-- Left Column: Brand Hero & Highlights -->
    <section class="lg:col-span-6 space-y-6 animate-fade-up text-center lg:text-left">
      <div class="inline-flex items-center gap-3.5 group">
        <img src="/static/assets/logo.jpg"
             onerror="this.onerror=null; this.src='https://placehold.co/56x56/0284c7/ffffff?text=L2L';"
             alt="Learn2Lead"
             class="h-14 w-14 rounded-2xl object-cover bg-white ring-2 ring-sky-400/50 shadow-lg shadow-sky-500/20 transition-transform duration-300 group-hover:scale-105" />
        <div class="text-left">
          <span class="font-black text-3xl tracking-tight text-white">Learn<span class="text-sky-400">2</span>Lead</span>
          <span class="block text-xs font-semibold uppercase tracking-widest text-sky-300/80">Student Career &amp; Study Suite</span>
        </div>
      </div>

      <h1 class="text-4xl sm:text-5xl font-black tracking-tight leading-tight text-white">
        Master Academics.<br />
        <span class="bg-gradient-to-r from-sky-400 via-indigo-400 to-emerald-400 bg-clip-text text-transparent">Lead Your Career.</span>
      </h1>

      <p class="text-sm sm:text-base text-slate-300 leading-relaxed max-w-lg mx-auto lg:mx-0">
        Your all-in-one smart learning platform with AI-powered 15-question quizzes, personalized study scheduling, and live performance analytics.
      </p>

      <!-- Feature Highlights
      <div class="grid sm:grid-cols-3 gap-3 pt-2">

          <p class="text-xs text-slate-400 mt-1">Planner, Notes MCQs &amp; Analytics</p>
        </div>
        <div class="animate-fade-up delay-200 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-md p-4 hover:bg-white/10 transition-all duration-300 hover:-translate-y-1">
          <p class="text-xs font-extrabold uppercase tracking-wider text-indigo-400">Module 2</p>
          <p class="text-sm font-bold text-white mt-1">Employability</p>
          <p class="text-xs text-slate-400 mt-1">Resume Check &amp; Mock Prep</p>
        </div>
        <div class="animate-fade-up delay-300 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-md p-4 hover:bg-white/10 transition-all duration-300 hover:-translate-y-1">
          <p class="text-xs font-extrabold uppercase tracking-wider text-emerald-400">Module 3</p>
          <p class="text-sm font-bold text-white mt-1">Leadership</p>
          <p class="text-xs text-slate-400 mt-1">Soft Skills &amp; Readiness</p>
        </div>
      </div> -->
    </section>

    <!-- Right Column: Glassmorphic Login / Register Card -->
    <section class="lg:col-span-6 animate-fade-up delay-100">
      <div class="bg-white/95 backdrop-blur-xl text-slate-800 rounded-3xl border border-white/40 p-7 sm:p-8 shadow-2xl shadow-black/40 space-y-6">
        <!-- Tab Switcher -->
        <div class="grid grid-cols-2 gap-2 p-1.5 rounded-2xl bg-slate-100 border border-slate-200/80">
          <button id="tab-login" type="button" onclick="switchAuthTab('login')"
                  class="py-2.5 rounded-xl text-sm font-extrabold transition-all duration-200 bg-gradient-to-r from-sky-600 to-indigo-600 text-white shadow-md cursor-pointer">
            Sign In
          </button>
          <button id="tab-register" type="button" onclick="switchAuthTab('register')"
                  class="py-2.5 rounded-xl text-sm font-extrabold transition-all duration-200 text-slate-600 hover:text-slate-900 cursor-pointer">
            Create Account
          </button>
        </div>

        <!-- Status Alert -->
        <div id="auth-message" class="hidden rounded-xl px-4 py-3 text-xs font-bold"></div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Email Address</label>
            <input id="login-email" type="email" required placeholder="you@college.edu"
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/40 focus:border-sky-500 transition-all" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Password</label>
            <input id="login-password" type="password" required placeholder="Enter your password"
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/40 focus:border-sky-500 transition-all" />
          </div>
          <button id="login-btn" type="submit"
                  class="btn-shimmer w-full py-3.5 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 active:scale-[0.98] text-white text-sm font-extrabold rounded-xl shadow-lg shadow-sky-600/25 transition-all cursor-pointer">
            Sign In to Learn2Lead &rarr;
          </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="hidden space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Full Name</label>
            <input id="reg-name" type="text" required placeholder="e.g., Mohammed Fazal"
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition-all" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Email Address</label>
            <input id="reg-email" type="email" required placeholder="you@college.edu"
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition-all" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Password</label>
            <input id="reg-password" type="password" required minlength="6" placeholder="Minimum 6 characters"
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition-all" />
          </div>
          <button id="reg-btn" type="submit"
                  class="btn-shimmer w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-[0.98] text-white text-sm font-extrabold rounded-xl shadow-lg shadow-emerald-600/25 transition-all cursor-pointer">
            Create Student Account &rarr;
          </button>
        </form>

        <!-- <p class="text-center text-xs text-slate-400">
          Protected with JWT Authentication &bull; Powered by FastAPI &amp; PostgreSQL
        </p> -->
      </div>
    </section>
  </main>

  <script>
    // Redirect straight to dashboard if already logged in
    if (localStorage.getItem("l2l_token")) {
      window.location.href = "/dashboard";
    }

    function showAuthMsg(text, isError = false) {
      const box = document.getElementById("auth-message");
      box.textContent = text;
      box.className = isError
        ? "rounded-xl px-4 py-3 text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200"
        : "rounded-xl px-4 py-3 text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200";
    }

    function switchAuthTab(tab) {
      const loginForm = document.getElementById("login-form");
      const regForm = document.getElementById("register-form");
      const tabLogin = document.getElementById("tab-login");
      const tabReg = document.getElementById("tab-register");
      document.getElementById("auth-message").className = "hidden";

      if (tab === "register") {
        loginForm.classList.add("hidden");
        regForm.classList.remove("hidden");
        tabReg.className = "py-2.5 rounded-xl text-sm font-extrabold transition-all duration-200 bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-md cursor-pointer";
        tabLogin.className = "py-2.5 rounded-xl text-sm font-extrabold transition-all duration-200 text-slate-600 hover:text-slate-900 cursor-pointer";
      } else {
        regForm.classList.add("hidden");
        loginForm.classList.remove("hidden");
        tabLogin.className = "py-2.5 rounded-xl text-sm font-extrabold transition-all duration-200 bg-gradient-to-r from-sky-600 to-indigo-600 text-white shadow-md cursor-pointer";
        tabReg.className = "py-2.5 rounded-xl text-sm font-extrabold transition-all duration-200 text-slate-600 hover:text-slate-900 cursor-pointer";
      }
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("login-btn");
      btn.disabled = true;
      btn.textContent = "Signing in...";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("login-email").value.trim(),
            password: document.getElementById("login-password").value,
          }),
        });
        const data = await res.json();
        if (res.ok && data.access_token) {
          localStorage.setItem("l2l_token", data.access_token);
          localStorage.setItem("l2l_user", JSON.stringify(data.user || { email: document.getElementById("login-email").value.trim() }));
          window.location.href = "/dashboard";
        } else {
          showAuthMsg(data.detail || "Invalid email or password.", true);
        }
      } catch {
        showAuthMsg("Could not connect to server. Make sure FastAPI is running.", true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In to Learn2Lead →";
      }
    });

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("reg-btn");
      btn.disabled = true;
      btn.textContent = "Creating account...";

      const fullName = document.getElementById("reg-name").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value;

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ full_name: fullName, name: fullName, email, password }),
        });
        const data = await res.json();
        if (res.ok) {
          if (data.access_token) {
            localStorage.setItem("l2l_token", data.access_token);
            localStorage.setItem("l2l_user", JSON.stringify(data.user || { full_name: fullName, email }));
            window.location.href = "/dashboard";
          } else {
            showAuthMsg("Account created successfully! Please sign in.", false);
            switchAuthTab("login");
            document.getElementById("login-email").value = email;
          }
        } else {
          showAuthMsg(data.detail || "Registration failed. Please try again.", true);
        }
      } catch {
        showAuthMsg("Could not connect to server. Make sure FastAPI is running.", true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Create Student Account →";
      }
    });
  </script>
</body>
</html>
