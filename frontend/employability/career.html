<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employability & Career Prep — Learn2Lead</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <nav class="sticky top-0 z-40 flex items-center justify-between gap-4 border-b border-white/10 bg-slate-900 px-4 py-3 text-white md:px-6">
    <a href="/dashboard" class="flex items-center gap-3 font-extrabold">Learn<span class="text-sky-400">2</span>Lead</a>
    <div class="flex items-center gap-2 text-sm font-semibold">
      <a href="/dashboard" class="rounded-xl px-3 py-2 text-slate-300 hover:bg-white/10">Home</a>
      <a href="/static/leadership/leadership.html" class="rounded-xl px-3 py-2 text-slate-300 hover:bg-white/10">Leadership</a>
      <button onclick="logout()" class="rounded-xl bg-rose-600 px-3 py-2 text-xs font-bold">Logout</button>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl space-y-6 px-4 py-8">
    <section class="rounded-3xl bg-gradient-to-r from-indigo-950 via-slate-900 to-sky-950 p-7 text-white shadow-xl">
      <p class="text-xs font-bold uppercase tracking-widest text-sky-300">Module 2</p>
      <h1 class="mt-2 text-3xl font-black">Employability &amp; Career Prep</h1>
      <p class="mt-2 max-w-2xl text-sm text-slate-300">Choose a career track, complete your roadmap, and monitor placement readiness.</p>
    </section>

    <section class="grid gap-5 lg:grid-cols-[1.1fr_.9fr]">
      <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Career Track</p>
            <h2 id="domain-name" class="mt-1 text-xl font-black">Loading...</h2>
          </div>
          <span id="domain-progress" class="rounded-full bg-indigo-50 px-3 py-1 text-sm font-bold text-indigo-700">0%</span>
        </div>
        <p id="domain-description" class="mt-3 text-sm text-slate-600"></p>
        <label class="mt-5 block text-xs font-bold uppercase tracking-wider text-slate-500" for="domain-select">Switch career track</label>
        <div class="mt-2 flex gap-2">
          <select id="domain-select" class="min-w-0 flex-1 rounded-xl border border-slate-200 px-3 py-2.5 text-sm"></select>
          <button id="select-domain" class="rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-bold text-white">Select</button>
        </div>
      </div>

      <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
        <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Placement Readiness</p>
        <div class="mt-3 flex items-end gap-3">
          <p id="readiness-score" class="text-5xl font-black text-slate-900">--</p>
          <p class="pb-1 text-sm font-bold text-slate-400">/ 100</p>
        </div>
        <div class="mt-4 h-3 overflow-hidden rounded-full bg-slate-100">
          <div id="readiness-bar" class="h-full rounded-full bg-gradient-to-r from-sky-500 to-emerald-500" style="width:0%"></div>
        </div>
        <button id="record-readiness" class="mt-4 w-full rounded-xl border border-slate-200 py-2.5 text-sm font-bold hover:bg-slate-50">Record readiness snapshot</button>
      </div>
    </section>

    <section class="grid gap-6 lg:grid-cols-[1.4fr_.6fr]">
      <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="text-lg font-black">Career Roadmap</h2>
        <div id="roadmap-list" class="mt-4 space-y-3"></div>
      </div>
      <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="text-lg font-black">Readiness Breakdown</h2>
        <div id="readiness-breakdown" class="mt-4 space-y-3"></div>
      </div>
    </section>
  </main>

  <script src="/static/employability/employability.js"></script>
</body>
</html>
